<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>KSF Screen</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f1116;
    color: white;
    font-family: Arial, sans-serif;
}

#home {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 460px;
    background: #181b22;
    padding: 40px;
    border-radius: 18px;
    text-align: center;
}

h1 {
    margin: 0 0 10px;
    font-size: 42px;
}

.subtitle {
    color: #9da3ae;
    margin-bottom: 30px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.primary {
    background: #5865f2;
    color: white;
}

.secondary {
    background: #2b303b;
    color: white;
}

.danger {
    background: #da373c;
    color: white;
}

.full {
    width: 100%;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    background: #101217;
    border: 1px solid #353b48;
    border-radius: 9px;
    color: white;
    text-align: center;
    font-size: 18px;
    text-transform: uppercase;
}

#room {
    display: none;
    height: 100vh;
    flex-direction: column;
}

.topbar {
    min-height: 72px;
    background: #181b22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    gap: 20px;
}

.room-info {
    display: flex;
    align-items: center;
    gap: 16px;
}

#roomCode {
    color: #7d87ff;
    font-size: 21px;
    letter-spacing: 3px;
    font-weight: bold;
}

#status {
    color: #aab0bb;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 10px;
}

#stopButton {
    display: none;
}

.video-area {
    flex: 1;
    padding: 22px;
    min-height: 0;
}

.video-box {
    width: 100%;
    height: 100%;
    background: #08090c;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

#emptyMessage {
    color: #777f8c;
    text-align: center;
    padding: 20px;
}

#sourceModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .78);
    z-index: 100;
    align-items: center;
    justify-content: center;
}

.modal {
    width: 850px;
    max-width: 90vw;
    max-height: 80vh;
    overflow: auto;
    background: #181b22;
    border-radius: 16px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

.modal-note {
    color: #9da3ae;
    margin-top: -5px;
    margin-bottom: 20px;
    font-size: 14px;
}

.sources {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.source {
    background: #242832;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
}

.source:hover {
    border-color: #5865f2;
}

.source img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: black;
    border-radius: 6px;
}

.source-name {
    padding: 9px 4px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.modal-bottom {
    margin-top: 20px;
    text-align: right;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="home">

<div class="card">

<h1>KSF Screen</h1>

<div class="subtitle">
Compartilhe sua tela com seus amigos.
</div>

<button
id="createButton"
class="primary full">
Criar Sala
</button>

<input
id="codeInput"
maxlength="6"
placeholder="CÓDIGO DA SALA">

<button
id="joinButton"
class="secondary full">
Entrar na Sala
</button>

</div>

</div>


<!-- SALA -->

<div id="room">

<div class="topbar">

<div class="room-info">

<strong>KSF Screen</strong>

<span>
Sala:
</span>

<span id="roomCode">
------
</span>

<span id="status">
Conectando...
</span>

</div>


<div class="actions">

<button
id="shareButton"
class="primary">
🖥 Compartilhar Tela
</button>

<button
id="stopButton"
class="danger">
Parar transmissão
</button>

</div>

</div>


<div class="video-area">

<div class="video-box">

<div id="emptyMessage">
Nenhuma transmissão ativa.
</div>

<video
id="video"
autoplay
playsinline>
</video>

</div>

</div>

</div>


<!-- SELETOR DE TELA -->

<div id="sourceModal">

<div class="modal">

<h2>
O que você quer compartilhar?
</h2>

<div class="modal-note">
KSF Screen tentará transmitir também o áudio do computador.
</div>

<div
id="sources"
class="sources">
</div>

<div class="modal-bottom">

<button
id="cancelSource"
class="secondary">
Cancelar
</button>

</div>

</div>

</div>


<script>

const { io } =
    require("socket.io-client");

const { ipcRenderer } =
    require("electron");


/*
==============================
ELEMENTOS
==============================
*/

const home =
    document.getElementById("home");

const room =
    document.getElementById("room");

const createButton =
    document.getElementById("createButton");

const joinButton =
    document.getElementById("joinButton");

const codeInput =
    document.getElementById("codeInput");

const roomCode =
    document.getElementById("roomCode");

const status =
    document.getElementById("status");

const shareButton =
    document.getElementById("shareButton");

const stopButton =
    document.getElementById("stopButton");

const video =
    document.getElementById("video");

const emptyMessage =
    document.getElementById("emptyMessage");

const sourceModal =
    document.getElementById("sourceModal");

const sourcesContainer =
    document.getElementById("sources");

const cancelSource =
    document.getElementById("cancelSource");


/*
==============================
SOCKET
==============================
*/

const socket =
    io("https://ksf-screen.onrender.com");


let currentRoom = null;
let isHost = false;

let peer = null;
let localStream = null;

let pendingIceCandidates = [];

let selectedSourceId = null;

let broadcastBusy = false;

let waitingBroadcastPermission = false;

let isBroadcasting = false;


/*
==============================
CONFIGURAÇÃO WEBRTC
==============================
*/

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/*
==============================
CÓDIGO DA SALA
==============================
*/

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code += chars[
            Math.floor(
                Math.random() *
                chars.length
            )
        ];

    }

    return code;
}


/*
==============================
MOSTRAR SALA
==============================
*/

function showRoom(code) {

    currentRoom = code;

    roomCode.textContent = code;

    home.style.display = "none";

    room.style.display = "flex";

    updateShareButton();
}


/*
==============================
BOTÃO DE COMPARTILHAR
==============================
*/

function updateShareButton() {

    if (isBroadcasting) {

        shareButton.style.display =
            "none";

        stopButton.style.display =
            "inline-block";

        return;
    }


    stopButton.style.display =
        "none";

    shareButton.style.display =
        "inline-block";


    if (broadcastBusy) {

        shareButton.disabled =
            true;

        shareButton.textContent =
            "Amigo transmitindo";

    }

    else {

        shareButton.disabled =
            false;

        shareButton.textContent =
            "🖥 Compartilhar Tela";

    }

}


/*
==============================
CRIAR SALA
==============================
*/

createButton.onclick = () => {

    const code =
        generateRoomCode();

    isHost = true;

    showRoom(code);

    status.textContent =
        "Criando sala...";

    socket.emit(
        "create-room",
        code
    );
};


/*
==============================
ENTRAR
==============================
*/

joinButton.onclick = () => {

    const code =
        codeInput.value
            .trim()
            .toUpperCase();

    if (code.length !== 6) {

        alert(
            "Digite um código de 6 caracteres."
        );

        return;
    }

    isHost = false;

    showRoom(code);

    status.textContent =
        "Entrando...";

    socket.emit(
        "join-room",
        code
    );
};


/*
==============================
SOCKET - SALA
==============================
*/

socket.on(
    "room-created",
    () => {

        status.textContent =
            "Aguardando amigo...";
    }
);


socket.on(
    "room-joined",
    () => {

        status.textContent =
            "Conectado!";
    }
);


socket.on(
    "friend-joined",
    () => {

        status.textContent =
            "Amigo conectado!";
    }
);


socket.on(
    "friend-left",
    () => {

        status.textContent =
            "Amigo desconectado.";

        broadcastBusy = false;

        stopLocalTransmission(false);

        closePeer();

        updateShareButton();
    }
);


socket.on(
    "host-left",
    () => {

        status.textContent =
            "O dono saiu da sala.";

        broadcastBusy = false;

        stopLocalTransmission(false);

        closePeer();

        updateShareButton();
    }
);


socket.on(
    "room-error",
    message => {

        alert(message);

        room.style.display = "none";
        home.style.display = "flex";
    }
);


/*
==============================
CONTROLE DE TRANSMISSÃO
==============================
*/

socket.on(
    "broadcast-granted",
    async () => {

        if (
            !waitingBroadcastPermission ||
            !selectedSourceId
        ) {
            return;
        }

        waitingBroadcastPermission =
            false;

        broadcastBusy =
            false;

        try {

            await startSharing(
                selectedSourceId
            );

        }

        catch (error) {

            console.error(
                "Erro ao iniciar transmissão:",
                error
            );

            socket.emit(
                "stop-broadcast"
            );

            selectedSourceId =
                null;

            broadcastBusy =
                false;

            updateShareButton();

            alert(
                "Não foi possível iniciar a transmissão."
            );

        }

    }
);


socket.on(
    "broadcast-denied",
    () => {

        waitingBroadcastPermission =
            false;

        selectedSourceId =
            null;

        broadcastBusy =
            true;

        status.textContent =
            "Seu amigo já está transmitindo.";

        updateShareButton();
    }
);


socket.on(
    "broadcast-started",
    () => {

        broadcastBusy =
            true;

        status.textContent =
            "Seu amigo está iniciando a transmissão...";

        updateShareButton();
    }
);


socket.on(
    "broadcast-busy",
    () => {

        broadcastBusy =
            true;

        status.textContent =
            "Seu amigo está transmitindo.";

        updateShareButton();
    }
);


socket.on(
    "broadcast-stopped",
    () => {

        broadcastBusy =
            false;

        video.srcObject =
            null;

        video.style.display =
            "none";

        emptyMessage.style.display =
            "block";

        emptyMessage.textContent =
            "Nenhuma transmissão ativa.";

        closePeer();

        status.textContent =
            "Transmissão encerrada. Você pode compartilhar agora.";

        updateShareButton();
    }
);


/*
==============================
CRIAR WEBRTC PEER
==============================
*/

function createPeer() {

    if (peer) {

        peer.close();

        peer = null;
    }

    pendingIceCandidates =
        [];

    peer =
        new RTCPeerConnection(
            rtcConfig
        );


    peer.onicecandidate =
        event => {

            if (event.candidate) {

                socket.emit(
                    "signal",
                    {
                        type: "ice",

                        candidate:
                            event.candidate
                    }
                );

            }

        };


    peer.onconnectionstatechange =
        () => {

            if (!peer) {
                return;
            }

            console.log(
                "WebRTC:",
                peer.connectionState
            );


            if (
                peer.connectionState ===
                "connected"
            ) {

                if (isBroadcasting) {

                    status.textContent =
                        "Transmitindo sua tela!";

                }

                else {

                    status.textContent =
                        "Assistindo transmissão!";

                }

            }


            else if (
                peer.connectionState ===
                    "failed" ||
                peer.connectionState ===
                    "disconnected"
            ) {

                console.log(
                    "Conexão WebRTC interrompida."
                );

            }

        };


    peer.ontrack =
        event => {

            const remoteStream =
                event.streams[0];


            video.srcObject =
                remoteStream;

            /*
            Quem recebe a transmissão
            precisa ouvir o áudio.
            */

            video.muted =
                false;

            video.volume =
                1;

            video.style.display =
                "block";

            emptyMessage.style.display =
                "none";

            status.textContent =
                "Assistindo transmissão!";


            /*
            Electron normalmente permite
            autoplay, mas chamamos play()
            para garantir.
            */

            video.play()
                .catch(error => {

                    console.log(
                        "Autoplay aguardando:",
                        error
                    );

                });

        };


    return peer;
}


/*
==============================
PROCESSAR ICE PENDENTE
==============================
*/

async function flushPendingIceCandidates() {

    if (
        !peer ||
        !peer.remoteDescription
    ) {

        return;
    }


    const candidates =
        pendingIceCandidates;

    pendingIceCandidates =
        [];


    for (
        const candidate
        of candidates
    ) {

        try {

            await peer.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Erro ao adicionar ICE pendente:",
                error
            );

        }

    }

}


/*
==============================
SINALIZAÇÃO WEBRTC
==============================
*/

socket.on(
    "signal",
    async data => {

        try {

            if (
                data.type === "offer"
            ) {

                /*
                O outro usuário é quem
                está transmitindo.
                */

                isBroadcasting =
                    false;

                broadcastBusy =
                    true;

                updateShareButton();


                const p =
                    createPeer();


                await p.setRemoteDescription(
                    data.sdp
                );


                await flushPendingIceCandidates();


                const answer =
                    await p.createAnswer();


                await p.setLocalDescription(
                    answer
                );


                socket.emit(
                    "signal",
                    {
                        type:
                            "answer",

                        sdp:
                            p.localDescription
                    }
                );

            }


            else if (
                data.type === "answer"
            ) {

                if (!peer) {
                    return;
                }


                await peer
                    .setRemoteDescription(
                        data.sdp
                    );


                await flushPendingIceCandidates();

            }


            else if (
                data.type === "ice"
            ) {

                if (
                    !peer ||
                    !peer.remoteDescription
                ) {

                    pendingIceCandidates.push(
                        data.candidate
                    );

                    console.log(
                        "ICE aguardando descrição remota."
                    );

                    return;
                }


                await peer.addIceCandidate(
                    data.candidate
                );

            }


            else if (
                data.type === "stop"
            ) {

                video.srcObject =
                    null;

                video.style.display =
                    "none";

                emptyMessage.style.display =
                    "block";

                emptyMessage.textContent =
                    "Nenhuma transmissão ativa.";

                closePeer();

            }

        }

        catch (error) {

            console.error(
                "Erro WebRTC:",
                error
            );

        }

    }
);


/*
==============================
CRIAR OFFER
==============================
*/

async function startOffer() {

    if (!localStream) {
        return;
    }


    const p =
        createPeer();


    localStream
        .getTracks()
        .forEach(
            track => {

                p.addTrack(
                    track,
                    localStream
                );

            }
        );


    const offer =
        await p.createOffer();


    await p.setLocalDescription(
        offer
    );


    socket.emit(
        "signal",
        {
            type:
                "offer",

            sdp:
                p.localDescription
        }
    );


    status.textContent =
        "Conectando transmissão...";

}


/*
==============================
ESCOLHER TELA
==============================
*/

shareButton.onclick =
async () => {

    if (broadcastBusy) {

        alert(
            "Seu amigo já está transmitindo."
        );

        return;
    }


    try {

        const availableSources =
            await ipcRenderer.invoke(
                "get-screen-sources"
            );


        sourcesContainer.innerHTML =
            "";


        for (
            const source
            of availableSources
        ) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "source";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                source.thumbnail;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "source-name";


            name.textContent =
                source.name;


            item.appendChild(
                image
            );

            item.appendChild(
                name
            );


            item.onclick =
                () => {

                    sourceModal.style.display =
                        "none";


                    /*
                    Primeiro reservamos
                    a transmissão no servidor.
                    */

                    selectedSourceId =
                        source.id;

                    waitingBroadcastPermission =
                        true;

                    status.textContent =
                        "Preparando transmissão...";

                    shareButton.disabled =
                        true;


                    socket.emit(
                        "request-broadcast"
                    );

                };


            sourcesContainer.appendChild(
                item
            );

        }


        sourceModal.style.display =
            "flex";

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Não foi possível listar as telas."
        );

    }

};


cancelSource.onclick =
    () => {

        sourceModal.style.display =
            "none";
    };


/*
==============================
CAPTURAR TELA
==============================
*/

async function captureScreen(
    sourceId
) {

    /*
    Primeiro tentamos capturar
    VÍDEO + ÁUDIO DO SISTEMA.

    Algumas fontes/versões do Windows
    podem não disponibilizar áudio
    dessa maneira.

    Se falhar, fazemos automaticamente
    uma segunda tentativa somente
    com o vídeo.
    */

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        mandatory: {

                            chromeMediaSource:
                                "desktop",

                            chromeMediaSourceId:
                                sourceId

                        }

                    },

                    video: {

                        mandatory: {

                            chromeMediaSource:
                                "desktop",

                            chromeMediaSourceId:
                                sourceId,

                            maxWidth:
                                1920,

                            maxHeight:
                                1080,

                            maxFrameRate:
                                60

                        }

                    }

                });


        console.log(
            "Captura iniciada com áudio.",
            stream.getAudioTracks().length,
            "faixa(s) de áudio."
        );


        return stream;

    }

    catch (audioError) {

        console.warn(
            "Áudio do sistema indisponível. Tentando somente vídeo.",
            audioError
        );


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:
                        false,

                    video: {

                        mandatory: {

                            chromeMediaSource:
                                "desktop",

                            chromeMediaSourceId:
                                sourceId,

                            maxWidth:
                                1920,

                            maxHeight:
                                1080,

                            maxFrameRate:
                                60

                        }

                    }

                });


        console.log(
            "Captura iniciada sem áudio."
        );


        return stream;

    }

}


/*
==============================
COMEÇAR TRANSMISSÃO
==============================
*/

async function startSharing(
    sourceId
) {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;
    }


    localStream =
        await captureScreen(
            sourceId
        );


    selectedSourceId =
        null;


    isBroadcasting =
        true;

    broadcastBusy =
        false;


    /*
    Mostramos a própria tela localmente.
    O áudio fica MUDO localmente para
    evitar eco/realimentação.
    */

    video.srcObject =
        localStream;

    video.muted =
        true;

    video.style.display =
        "block";

    emptyMessage.style.display =
        "none";


    updateShareButton();


    const audioTracks =
        localStream
            .getAudioTracks();


    if (
        audioTracks.length > 0
    ) {

        status.textContent =
            "Transmitindo tela + áudio...";

    }

    else {

        status.textContent =
            "Transmitindo tela (áudio indisponível nesta fonte)...";

    }


    /*
    AGORA QUALQUER UM PODE SER
    O TRANSMISSOR.

    Não existe mais:
    if (isHost)
    */

    await startOffer();


    /*
    Se a captura for encerrada pelo
    Windows/navegador, encerramos também
    a transmissão da sala.
    */

    const videoTrack =
        localStream
            .getVideoTracks()[0];


    if (videoTrack) {

        videoTrack.onended =
            () => {

                if (
                    isBroadcasting
                ) {

                    stopTransmission();

                }

            };

    }

}


/*
==============================
PARAR TRANSMISSÃO
==============================
*/

function stopLocalTransmission(
    resetStatus = true
) {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;
    }


    isBroadcasting =
        false;

    waitingBroadcastPermission =
        false;

    selectedSourceId =
        null;


    video.srcObject =
        null;

    video.style.display =
        "none";


    emptyMessage.style.display =
        "block";

    emptyMessage.textContent =
        "Nenhuma transmissão ativa.";


    closePeer();


    if (resetStatus) {

        status.textContent =
            "Transmissão encerrada.";

    }


    updateShareButton();

}


function stopTransmission() {

    if (!isBroadcasting) {
        return;
    }


    /*
    Avisamos o receptor para
    remover a imagem imediatamente.
    */

    socket.emit(
        "signal",
        {
            type:
                "stop"
        }
    );


    /*
    Liberamos a vez no servidor.
    */

    socket.emit(
        "stop-broadcast"
    );


    broadcastBusy =
        false;


    stopLocalTransmission(
        true
    );

}


stopButton.onclick =
    () => {

        stopTransmission();

    };


/*
==============================
FECHAR WEBRTC
==============================
*/

function closePeer() {

    if (peer) {

        try {

            peer.onicecandidate =
                null;

            peer.ontrack =
                null;

            peer.onconnectionstatechange =
                null;

            peer.close();

        }

        catch (error) {

            console.error(
                "Erro ao fechar WebRTC:",
                error
            );

        }


        peer =
            null;

    }


    pendingIceCandidates =
        [];

}

video.style.display =
    "none";

updateShareButton();

</script>
